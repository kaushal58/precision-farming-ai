version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: acg-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_crop_guardian

  server:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.server
    container_name: acg-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai_crop_guardian
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ../server/uploads:/app/uploads

  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/Dockerfile.ai
    container_name: acg-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models

  client:
    build:
      context: ../client
      dockerfile: ../docker/Dockerfile.client
    container_name: acg-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data:
